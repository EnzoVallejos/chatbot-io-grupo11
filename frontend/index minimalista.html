<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot Grupo 11</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f4;
      --surface: #ffffff;
      --surface2: #f0f0ef;
      --border: #e2e2e0;
      --border-hover: #c8c8c5;
      --text: #1a1a18;
      --text-mid: #5c5c59;
      --text-muted: #9c9c99;
      --accent: #1a1a18;
      --blue: #2563eb;
      --blue-bg: #eff6ff;
      --blue-text: #1d4ed8;
      --green-bg: #f0fdf4;
      --green-t: #15803d;
      --red-bg: #fef2f2;
      --red-t: #b91c1c;
      --amber-bg: #fffbeb;
      --amber-t: #92400e;
      --sans: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 780px;
      height: 100vh;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }

    header h1 {
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .status-badge {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
    }

    .messages-list {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .messages-list::-webkit-scrollbar { width: 4px; }
    .messages-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-row { display: flex; width: 100%; animation: fadeIn 0.15s ease-out forwards; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot  { justify-content: flex-start; }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.875rem;
      line-height: 1.55;
    }

    .msg-row.user .bubble {
      background: var(--text);
      color: #ffffff;
      border-bottom-right-radius: 3px;
    }

    .msg-row.bot .bubble {
      background: transparent;
      color: var(--text);
      border-bottom-left-radius: 3px;
      padding-left: 0;
    }

    .response-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 0.78rem;
      line-height: 1.7;
      white-space: pre-wrap;
      color: var(--text-mid);
    }

    .eval-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-top: 10px;
      width: 100%;
    }

    .eval-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .eval-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .eval-score {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: var(--mono);
    }

    .eval-section { margin-bottom: 12px; }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    .section-comment {
      font-size: 0.84rem;
      color: var(--text-mid);
      padding-left: 12px;
      border-left: 2px solid var(--border);
      line-height: 1.55;
    }

    .eval-list {
      margin-top: 4px;
      padding-left: 16px;
      font-size: 0.84rem;
      color: var(--text-mid);
      line-height: 1.7;
    }

    .chips-container {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-mid);
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: var(--sans);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .chip:hover {
      border-color: var(--border-hover);
      color: var(--text);
      background: var(--surface2);
    }

    .chip:disabled {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }

    .input-container {
      padding: 14px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-wrapper {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 2px 4px 2px 14px;
      transition: border-color 0.12s;
    }

    .input-wrapper:focus-within {
      border-color: var(--border-hover);
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.875rem;
      padding: 9px 0;
    }

    .input-wrapper input::placeholder { color: var(--text-muted); }
    .input-wrapper input:disabled { cursor: not-allowed; }

    .send-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }

    .send-btn.active {
      color: var(--blue);
      background: var(--blue-bg);
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 2px;
      align-items: center;
    }

    .typing-dot {
      width: 4px;
      height: 4px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes fadeIn  { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce  { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body>

<div class="chat-container">
  <header>
    <h1>Chatbot Grupo 11</h1>
    <div class="status-badge"><div class="status-dot"></div><span>localhost:3000</span></div>
  </header>

  <main class="messages-list" id="messages"></main>

  <div class="input-container">
    <div class="input-wrapper">
      <input type="text" id="chat-input" placeholder="Selecciona un modo para comenzar..." disabled />
      <button class="send-btn" id="send-button" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  const BASE = "http://localhost:3000";
  const msgs = document.getElementById('messages');
  const inp  = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-button');

  const MODOS = [
    { key: 'guia',        label: 'Guia teorica',   cls: '' },
    { key: 'ejemplo',     label: 'Ver ejemplo',    cls: '' },
    { key: 'practica',    label: 'Practica',       cls: '' },
    { key: 'diagnostico', label: 'Diagnostico',    cls: '' }
  ];

  const TIPOS = [
    { key: 'transporte', label: 'Transporte' },
    { key: 'asignacion', label: 'Asignacion' },
    { key: 'financiero', label: 'Financiero' },
    { key: 'produccion', label: 'Produccion' },
    { key: 'mezcla',     label: 'Mezcla'     }
  ];

  let modoActual          = null;
  let currentTipo         = null;
  let datosEscenarioActivo = null;
  let state   = 'modo';
  let waiting = false;

  function scrollDown() { msgs.scrollTop = msgs.scrollHeight; }

  function addBotMsg() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    msgs.appendChild(row);
    return row;
  }

  function addUserMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="bubble">${text}</div>`;
    msgs.appendChild(row);
    scrollDown();
  }

  async function botSay(html) {
    const el = addBotMsg();
    const b  = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = html;
    el.appendChild(b);
    scrollDown();
    return b;
  }

  function makeTyping() {
    const el = addBotMsg();
    const b  = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    el.appendChild(b);
    return b;
  }

  function makeChips(items, onClick) {
    const container = document.createElement('div');
    container.className = 'chips-container';
    items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = `chip ${item.cls || ''}`;
      btn.textContent = item.label;
      btn.onclick = () => {
        container.querySelectorAll('button').forEach(b => b.disabled = true);
        onClick(item);
      };
      container.appendChild(btn);
    });
    return container;
  }

  async function init() {
    modoActual = null; currentTipo = null; datosEscenarioActivo = null;
    state = 'modo'; waiting = false;
    inp.disabled = true;
    inp.placeholder = 'Selecciona un modo para comenzar...';
    sendBtn.classList.remove('active');

    const b = await botSay('Selecciona el modo de uso:');
    b.appendChild(makeChips(MODOS, item => {
      addUserMsg(item.label);
      modoActual = item.key;
      if (modoActual === 'diagnostico') {
        state = 'respuesta_teorica';
        solicitarPreguntaDiagnostico();
      } else {
        state = 'tipo';
        mostrarTipos();
      }
    }));
  }

  async function mostrarTipos() {
    const b = await botSay('Selecciona el tipo de problema:');
    b.appendChild(makeChips(TIPOS, async item => {
      addUserMsg(item.label);
      currentTipo = item.key;
      if (modoActual === 'practica') {
        levantarEscenarioRAG();
      } else {
        obtenerContenidoEstatico();
      }
    }));
  }

  async function obtenerContenidoEstatico() {
    const url = `${BASE}/api/${modoActual}/${currentTipo}`;
    const t   = makeTyping();
    try {
      const res  = await fetch(url);
      const text = await res.text();
      t.remove();

      const el = addBotMsg();
      const b  = document.createElement('div');
      b.className = 'bubble';
      b.innerHTML = `Resultado para <strong>${currentTipo}</strong>:`;

      const rb = document.createElement('div');
      rb.className = 'response-block';
      rb.textContent = text;
      b.appendChild(rb);
      el.appendChild(b);

      ofrecerVolver(b);
    } catch (e) {
      t.remove();
      await botSay('Error de conexion con el backend.');
      ofrecerVolver(msgs);
    }
  }

  async function levantarEscenarioRAG() {
    const url = `${BASE}/api/ejercicio/escenario/${currentTipo}`;
    const t   = makeTyping();
    try {
      const res = await fetch(url);
      datosEscenarioActivo = await res.json();
      t.remove();

      const el = addBotMsg();
      const b  = document.createElement('div');
      b.className = 'bubble';
      b.innerHTML = `<strong>${datosEscenarioActivo.titulo}</strong><br><span style="color:var(--text-mid);font-size:0.84rem">${datosEscenarioActivo.descripcion}</span>`;

      const rb = document.createElement('div');
      rb.className = 'response-block';
      rb.textContent = datosEscenarioActivo.datos;
      b.appendChild(rb);
      el.appendChild(b);

      await botSay('Ingresa las variables de decision, funcion objetivo y restricciones:');
      state = 'resolucion';
      inp.disabled = false;
      inp.placeholder = 'Escribe tu resolucion aqui...';
      inp.focus();
    } catch (e) {
      t.remove();
      await botSay('Error al obtener el escenario.');
      ofrecerVolver(msgs);
    }
  }

  async function solicitarPreguntaDiagnostico() {
    const url = `${BASE}/api/ejercicio/diagnostico`;
    const t   = makeTyping();
    try {
      const res = await fetch(url);
      datosEscenarioActivo = await res.json();
      t.remove();

      const el = addBotMsg();
      const b  = document.createElement('div');
      b.className = 'bubble';
      b.innerHTML = `<strong>${datosEscenarioActivo.titulo}</strong>`;

      const rb = document.createElement('div');
      rb.className = 'response-block';
      rb.textContent = datosEscenarioActivo.datos;
      b.appendChild(rb);
      el.appendChild(b);

      await botSay('Redacta tu respuesta:');
      state = 'respuesta_teorica';
      inp.disabled = false;
      inp.placeholder = 'Escribe tu respuesta aqui...';
      inp.focus();
    } catch (e) {
      t.remove();
      await botSay('No se pudo obtener la pregunta desde el servidor.');
      ofrecerVolver(msgs);
    }
  }

  async function procesarEnvio() {
    const val = inp.value.trim();
    if (!val || waiting) return;

    addUserMsg(val);
    inp.value = ''; inp.disabled = true;
    waiting = true;
    const t = makeTyping();

    let url     = `${BASE}/api/ejercicio/evaluar`;
    let payload = { tipo: currentTipo, escenario: datosEscenarioActivo, resolucion: val };

    if (modoActual === 'diagnostico') {
      url     = `${BASE}/api/ejercicio/evaluar-teoria`;
      payload = { pregunta: datosEscenarioActivo.datos, respuestaEstudiante: val };
    }

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const ev = await res.json();
      t.remove();

      let clr = 'var(--green-t)'; let bg = 'var(--green-bg)';
      if (ev.puntaje < 50)      { clr = 'var(--red-t)';   bg = 'var(--red-bg)'; }
      else if (ev.puntaje < 75) { clr = 'var(--amber-t)'; bg = 'var(--amber-bg)'; }

      const el   = addBotMsg();
      const card = document.createElement('div');
      card.className = 'eval-card';
      card.innerHTML = `
        <div class="eval-header">
          <div class="eval-title">Evaluacion</div>
          <div class="eval-score" style="background:${bg}; color:${clr}">${ev.puntaje}/100 — ${ev.nivel}</div>
        </div>
        <div class="eval-section">
          <div class="section-label">Resumen</div>
          <div class="section-comment">${ev.resumen}</div>
        </div>
        <div class="eval-section">
          <div class="section-label" style="color:var(--green-t)">Que estuvo bien</div>
          <ul class="eval-list">${(ev.que_estuvo_bien||[]).map(i=>`<li>${i}</li>`).join('')}</ul>
        </div>
        <div class="eval-section">
          <div class="section-label" style="color:var(--amber-t)">Que mejorar</div>
          <ul class="eval-list">${(ev.que_mejorar||[]).map(i=>`<li>${i}</li>`).join('')}</ul>
        </div>`;
      el.appendChild(card);
      scrollDown();

      const b = await botSay('Que deseas hacer ahora?');
      b.appendChild(makeChips([
        { key: 'siguiente', label: modoActual === 'diagnostico' ? 'Siguiente pregunta' : 'Nuevo escenario', cls: '' },
        { key: 'menu',      label: 'Volver al menu', cls: '' }
      ], item => {
        waiting = false;
        if (item.key === 'siguiente') {
          if (modoActual === 'diagnostico') solicitarPreguntaDiagnostico();
          else levantarEscenarioRAG();
        } else {
          msgs.innerHTML = '';
          init();
        }
      }));

    } catch (e) {
      t.remove();
      await botSay('Error al comunicarse con el evaluador. Verifica que el backend y Ollama esten corriendo.');
      waiting = false; inp.disabled = false;
    }
  }

  function ofrecerVolver(p) {
    p.appendChild(makeChips([{ key: 'ini', label: 'Volver al menu', cls: '' }], () => {
      msgs.innerHTML = '';
      init();
    }));
    scrollDown();
  }

  inp.addEventListener('input', () => {
    sendBtn.disabled = inp.value.trim().length === 0;
    if (!sendBtn.disabled) sendBtn.classList.add('active');
    else sendBtn.classList.remove('active');
  });

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !waiting) { e.preventDefault(); procesarEnvio(); }
  });

  sendBtn.addEventListener('click', () => { if (!waiting) procesarEnvio(); });

  init();
</script>
</body>
</html>
