<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OptimBot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #16181c;
      --surface2: #1e2026;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.18);
      --text: #f0f0ec;
      --text-muted: #6e7280;
      --text-mid: #a0a5b2;
      --blue: #378ADD;
      --blue-bg: rgba(55,138,221,0.1);
      --blue-text: #85B7EB;
      --teal: #1D9E75;
      --teal-bg: rgba(29,158,117,0.1);
      --teal-text: #5DCAA5;
      --mono: 'DM Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .window {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 700px;
    }

    .titlebar {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .tbar-dots { display: flex; gap: 6px; }
    .tbar-dots span { width: 10px; height: 10px; border-radius: 50%; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--blue-bg);
      border: 1px solid rgba(55,138,221,0.3);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .avatar svg { width: 16px; height: 16px; stroke: var(--blue-text); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .tbar-info { flex: 1; }
    .tbar-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .tbar-sub { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #60f09a; flex-shrink: 0; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }

    .msg { display: flex; flex-direction: column; gap: 6px; max-width: 86%; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; }

    .bubble {
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.55;
      border-radius: 14px;
    }

    .msg.bot .bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg.user .bubble {
      background: var(--blue-bg);
      border: 1px solid rgba(55,138,221,0.25);
      color: var(--blue-text);
      border-bottom-right-radius: 4px;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; }

    .chip {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-hover);
      background: transparent;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-mid);
      cursor: pointer;
      transition: all 0.13s ease;
      display: flex; align-items: center; gap: 6px;
    }

    .chip:hover { background: var(--surface2); color: var(--text); border-color: rgba(255,255,255,0.3); }
    .chip:disabled { opacity: 0.35; cursor: default; pointer-events: none; }

    .chip.guia { border-color: rgba(55,138,221,0.5); color: var(--blue-text); }
    .chip.guia:hover { background: var(--blue-bg); border-color: var(--blue); }

    .chip.ejemplo { border-color: rgba(29,158,117,0.5); color: var(--teal-text); }
    .chip.ejemplo:hover { background: var(--teal-bg); border-color: var(--teal); }

    .typing {
      display: flex; gap: 4px; align-items: center;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px; border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .tdot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted);
      animation: tdot 1.1s infinite;
    }
    .tdot:nth-child(2) { animation-delay: 0.18s; }
    .tdot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes tdot { 0%,80%,100%{transform:translateY(0);opacity:0.5} 40%{transform:translateY(-5px);opacity:1} }

    .response-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.8;
      color: var(--text-mid);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 240px;
      overflow-y: auto;
    }

    .response-block::-webkit-scrollbar { width: 3px; }
    .response-block::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }

    .back-btn {
      background: none; border: none;
      font-family: var(--sans); font-size: 12px;
      color: var(--text-muted); cursor: pointer;
      padding: 0; display: flex; align-items: center; gap: 4px;
      margin-top: 2px;
    }
    .back-btn:hover { color: var(--text); }

    .err { color: #f09595; font-size: 13px; line-height: 1.5; }
    .err code { font-family: var(--mono); font-size: 11px; }

    .footer-bar {
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }

    .footer-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="tbar-dots">
      <span style="background:#f06060"></span>
      <span style="background:#f0c060"></span>
      <span style="background:#60f09a"></span>
    </div>
    <div class="avatar">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    <div class="tbar-info">
      <div class="tbar-name">OptimBot</div>
      <div class="tbar-sub">guías de optimización lineal</div>
    </div>
    <div class="online-dot"></div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="footer-bar">
    <div class="footer-input">seleccioná una opción arriba...</div>
  </div>
</div>

<script>
const BASE = 'http://localhost:3000';
const msgs = document.getElementById('messages');
let modoActual = null;

const TIPOS = [
  { key: 'transporte',  label: 'Transporte',  icon: '🚛' },
  { key: 'asignacion',  label: 'Asignación',  icon: '👥' },
  { key: 'financiero',  label: 'Financiero',  icon: '💰' },
  { key: 'produccion',  label: 'Producción',  icon: '🏭' },
  { key: 'mezcla',      label: 'Mezcla',      icon: '🧪' },
];

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function scrollDown() {
  setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 60);
}

function addBotMsg() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  msgs.appendChild(el);
  scrollDown();
  return el;
}

function addUserMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  el.appendChild(b);
  msgs.appendChild(el);
  scrollDown();
}

function makeBubble(html) {
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = html;
  return b;
}

function makeTyping() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>';
  el.appendChild(t);
  msgs.appendChild(el);
  scrollDown();
  return el;
}

function makeChips(items, onClick) {
  const c = document.createElement('div');
  c.className = 'chips';
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'chip ' + (item.cls || '');
    btn.innerHTML = item.label;
    btn.onclick = () => {
      c.querySelectorAll('.chip').forEach(b => b.disabled = true);
      onClick(item);
    };
    c.appendChild(btn);
  });
  return c;
}

function makeBack() {
  const btn = document.createElement('button');
  btn.className = 'back-btn';
  btn.innerHTML = '← volver al inicio';
  btn.onclick = () => {
    msgs.innerHTML = '';
    modoActual = null;
    init();
  };
  return btn;
}

async function botSay(html, delay = 650) {
  const t = makeTyping();
  await sleep(delay);
  t.remove();
  const el = addBotMsg();
  el.appendChild(makeBubble(html));
  scrollDown();
  return el;
}

async function init() {
  const m = await botSay('¡Hola! Soy <strong>OptimBot</strong>.<br>¿Qué tipo de información necesitás?');
  m.appendChild(makeChips([
    { key: 'guia',    label: '📖 Guía teórica',    cls: 'guia' },
    { key: 'ejemplo', label: '💡 Ejemplo práctico', cls: 'ejemplo' },
  ], async item => {
    modoActual = item.key;
    addUserMsg(item.key === 'guia' ? 'Guía teórica' : 'Ejemplo práctico');
    await mostrarTipos();
  }));
  scrollDown();
}

async function mostrarTipos() {
  const label = modoActual === 'guia' ? 'guía' : 'ejemplo';
  const m = await botSay(`Perfecto. ¿De qué tipo de problema querés ver la <strong>${label}</strong>?`);
  m.appendChild(makeChips(TIPOS.map(t => ({
    ...t,
    label: `${t.icon} ${t.label}`,
    cls: modoActual,
  })), async item => {
    addUserMsg(item.label);
    await mostrarRespuesta(item.key, item.label);
  }));
  scrollDown();
}

async function mostrarRespuesta(tipo, labelTipo) {
  const url = `${BASE}/api/${modoActual}/${tipo}`;
  const t = makeTyping();
  scrollDown();
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    t.remove();
    const el = addBotMsg();
    el.appendChild(makeBubble(`Acá tenés el resultado para <strong>${labelTipo.replace(/[^\w\sáéíóúñÁÉÍÓÚÑ]/g,'').trim()}</strong>:`));
    const rb = document.createElement('div');
    rb.className = 'response-block';
    rb.textContent = text;
    el.appendChild(rb);
    el.appendChild(makeBack());
    scrollDown();
  } catch(e) {
    t.remove();
    const el = addBotMsg();
    el.appendChild(makeBubble(`<span class="err">No pude conectarme al servidor.<br>Verificá que el backend esté corriendo en <code>${BASE}</code> y que tenga CORS habilitado.</span>`));
    el.appendChild(makeBack());
    scrollDown();
  }
}

init();
</script>
</body>
</html>
