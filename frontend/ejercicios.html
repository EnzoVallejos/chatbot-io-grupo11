<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IO Ejercicios</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0f11; --surface: #16181c; --surface2: #1e2026;
      --border: rgba(255,255,255,0.07); --border-h: rgba(255,255,255,0.15);
      --text: #f0f0ec; --muted: #6e7280; --mid: #a0a5b2;
      --blue-bg: rgba(55,138,221,0.1); --blue-t: #85B7EB; --blue: #378ADD;
      --green-bg: rgba(29,158,117,0.1); --green-t: #5DCAA5;
      --amber-bg: rgba(186,117,23,0.1); --amber-t: #EF9F27;
      --red-bg: rgba(226,75,74,0.1); --red-t: #F09595;
      --purple-bg: rgba(138,55,221,0.1); --purple-t: #B885EB;
      --mono: 'DM Mono', monospace; --sans: 'Syne', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }

    .window { width: 100%; max-width: 620px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; height: 94vh; max-height: 820px; }

    /* titlebar */
    .titlebar { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .dots { display: flex; gap: 6px; }
    .dots span { width: 10px; height: 10px; border-radius: 50%; }
    .av { width: 32px; height: 32px; border-radius: 50%; background: var(--purple-bg); border: 1px solid rgba(138,55,221,0.25); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .tinfo { flex: 1; }
    .tname { font-size: 13px; font-weight: 700; }
    .tsub { font-size: 11px; color: var(--muted); font-family: var(--mono); }

    /* messages */
    .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msgs::-webkit-scrollbar { width: 4px; }
    .msgs::-webkit-scrollbar-thumb { background: var(--border-h); border-radius: 2px; }
    .msg { display: flex; flex-direction: column; gap: 5px; max-width: 92%; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; }
    .bubble { padding: 10px 14px; font-size: 13px; line-height: 1.6; border-radius: 14px; }
    .msg.bot .bubble { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: var(--blue-bg); border: 1px solid rgba(55,138,221,0.2); color: var(--blue-t); border-bottom-right-radius: 4px; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }

    /* chips */
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 2px; }
    .chip { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border-h); background: transparent; font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--mid); cursor: pointer; transition: all .13s; }
    .chip:hover { background: var(--surface2); color: var(--text); }
    .chip:disabled { opacity: .35; cursor: default; pointer-events: none; }

    /* scenario card */
    .scenario-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-top: 2px; font-size: 13px; line-height: 1.65; }
    .scenario-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .scenario-desc { color: var(--mid); }
    .scenario-data { font-family: var(--mono); font-size: 11.5px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text-mid); white-space: pre-wrap; line-height: 1.8; }
    .scenario-tag { font-family: var(--mono); font-size: 10px; color: var(--purple-t); background: var(--purple-bg); border: 1px solid rgba(138,55,221,0.2); border-radius: 6px; padding: 2px 8px; align-self: flex-start; }

    /* eval card */
    .eval-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }
    .eval-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .big-score { font-family: var(--mono); font-size: 28px; font-weight: 700; }
    .nivel-pill { font-family: var(--mono); font-size: 11px; padding: 3px 12px; border-radius: 999px; font-weight: 500; }
    .p-ex  { background: var(--green-bg); color: var(--green-t); border: 1px solid rgba(29,158,117,0.25); }
    .p-mb  { background: var(--blue-bg); color: var(--blue-t); border: 1px solid rgba(55,138,221,0.25); }
    .p-b   { background: var(--amber-bg); color: var(--amber-t); border: 1px solid rgba(186,117,23,0.25); }
    .p-r   { background: var(--red-bg); color: var(--red-t); border: 1px solid rgba(226,75,74,0.25); }
    .p-i   { background: var(--red-bg); color: var(--red-t); border: 1px solid rgba(226,75,74,0.25); }
    .section { display: flex; flex-direction: column; gap: 4px; }
    .section-title { font-size: 11px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .check-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.55; color: var(--mid); }
    .check-icon { flex-shrink: 0; font-size: 13px; margin-top: 1px; }
    .list-items { display: flex; flex-direction: column; gap: 5px; }
    .list-item { font-size: 12px; color: var(--mid); line-height: 1.55; display: flex; align-items: flex-start; gap: 6px; }
    .list-dot { flex-shrink: 0; font-size: 11px; margin-top: 2px; }
    .resumen { font-size: 12px; color: var(--mid); line-height: 1.65; padding-top: 8px; border-top: 1px solid var(--border); }
    .divider { border: none; border-top: 1px solid var(--border); }

    /* typing */
    .typing-b { display: flex; gap: 4px; align-items: center; padding: 10px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; border-bottom-left-radius: 4px; width: fit-content; }
    .tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: td 1.1s infinite; }
    .tdot:nth-child(2){animation-delay:.18s}.tdot:nth-child(3){animation-delay:.36s}
    @keyframes td{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}

    /* action buttons */
    .action-btn { align-self: flex-start; background: none; border: 1px solid var(--border-h); color: var(--mid); font-family: var(--sans); font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: all .13s; margin-top: 2px; }
    .action-btn:hover { border-color: var(--purple-t); color: var(--purple-t); background: var(--purple-bg); }

    /* footer */
    .footer { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
    textarea { flex: 1; background: var(--surface2); border: 1px solid var(--border-h); border-radius: 10px; padding: 9px 12px; font-family: var(--mono); font-size: 12px; color: var(--text); resize: none; min-height: 38px; max-height: 160px; line-height: 1.6; transition: border-color .13s; }
    textarea:focus { outline: none; border-color: rgba(138,55,221,0.5); }
    textarea::placeholder { color: var(--muted); font-family: var(--sans); font-size: 13px; }
    textarea:disabled { opacity: .4; }
    .sbtn { width: 36px; height: 36px; background: var(--purple-bg); border: 1px solid rgba(138,55,221,0.3); border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; transition: opacity .13s; }
    .sbtn:hover { opacity: .8; }
    .sbtn:disabled { opacity: .3; cursor: default; }
  </style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="dots"><span style="background:#f06060"></span><span style="background:#f0c060"></span><span style="background:#60f09a"></span></div>
    <div class="av">📐</div>
    <div class="tinfo">
      <div class="tname">IO Ejercicios</div>
      <div class="tsub">escenarios · resolución · evaluación con mistral</div>
    </div>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="footer">
    <textarea id="inp" placeholder="Escribí tu resolución (variables, función objetivo y restricciones)..." rows="1" disabled></textarea>
    <button class="sbtn" id="send-btn" disabled aria-label="Enviar">➤</button>
  </div>
</div>

<script>
const API = 'http://localhost:3000';
const TIPOS = ['transporte','asignacion','financiero','produccion','mezcla'];
const msgs = document.getElementById('msgs');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('send-btn');

let currentEscenario = null;
let currentTipo = null;
let waiting = false;
let state = 'tipo'; // 'tipo' | 'resolucion'

const sleep = ms => new Promise(r => setTimeout(r, ms));
const scrollDown = () => setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 60);

// ── DOM helpers ───────────────────────────────────────────────────────────────

function addBot(html, extra = []) {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = html;
  wrap.appendChild(b);
  extra.forEach(el => wrap.appendChild(el));
  msgs.appendChild(wrap);
  scrollDown();
  return wrap;
}

function addUser(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  wrap.appendChild(b);
  msgs.appendChild(wrap);
  scrollDown();
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing-el';
  const t = document.createElement('div');
  t.className = 'typing-b';
  t.innerHTML = '<div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>';
  wrap.appendChild(t);
  msgs.appendChild(wrap);
  scrollDown();
}
function removeTyping() { document.getElementById('typing-el')?.remove(); }

function makeChips(items, onClick) {
  const c = document.createElement('div');
  c.className = 'chips';
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.innerHTML = item.label;
    btn.onclick = () => {
      c.querySelectorAll('.chip').forEach(b => b.disabled = true);
      onClick(item);
    };
    c.appendChild(btn);
  });
  return c;
}

function makeActionBtn(label, onClick) {
  const btn = document.createElement('button');
  btn.className = 'action-btn';
  btn.textContent = label;
  btn.onclick = () => { btn.disabled = true; onClick(); };
  return btn;
}

// ── Eval card ─────────────────────────────────────────────────────────────────

function nivelClass(nivel) {
  const map = { 'Excelente': 'p-ex', 'Muy bien': 'p-mb', 'Bien': 'p-b', 'Regular': 'p-r', 'Insuficiente': 'p-i' };
  return map[nivel] || 'p-r';
}

function scoreColor(p) {
  if (p >= 80) return 'var(--green-t)';
  if (p >= 60) return 'var(--blue-t)';
  if (p >= 40) return 'var(--amber-t)';
  return 'var(--red-t)';
}

function buildEvalCard(r) {
  const card = document.createElement('div');
  card.className = 'eval-card';

  // header: puntaje + nivel
  card.innerHTML = `
    <div class="eval-header">
      <div class="big-score" style="color:${scoreColor(r.puntaje)}">${r.puntaje}<span style="font-size:14px;color:var(--muted)">/100</span></div>
      <span class="nivel-pill ${nivelClass(r.nivel)}">${r.nivel}</span>
    </div>
    <hr class="divider"/>

    <div class="section">
      <div class="section-title">Variables de decisión</div>
      <div class="check-row">
        <span class="check-icon">${r.variables_decision.correcto ? '✅' : '❌'}</span>
        <span>${r.variables_decision.comentario}</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Función objetivo</div>
      <div class="check-row">
        <span class="check-icon">${r.funcion_objetivo.correcto ? '✅' : '❌'}</span>
        <span>${r.funcion_objetivo.comentario}</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Restricciones</div>
      <div class="check-row">
        <span class="check-icon">${r.restricciones.correcto ? '✅' : '❌'}</span>
        <span>${r.restricciones.comentario}</span>
      </div>
    </div>

    <hr class="divider"/>

    <div class="section">
      <div class="section-title">✓ Qué estuvo bien</div>
      <div class="list-items">
        ${r.que_estuvo_bien.map(p => `<div class="list-item"><span class="list-dot" style="color:var(--green-t)">▸</span>${p}</div>`).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">→ Qué mejorar</div>
      <div class="list-items">
        ${r.que_mejorar.map(p => `<div class="list-item"><span class="list-dot" style="color:var(--amber-t)">▸</span>${p}</div>`).join('')}
      </div>
    </div>

    <div class="resumen">${r.resumen}</div>
  `;
  return card;
}

// ── API calls ─────────────────────────────────────────────────────────────────

async function fetchEscenario(tipo) {
  const res = await fetch(`${API}/api/ejercicio/escenario/${tipo}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function postEvaluar(tipo, escenario, resolucion) {
  const res = await fetch(`${API}/api/ejercicio/evaluar`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tipo, escenario, resolucion })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ── Flow ──────────────────────────────────────────────────────────────────────

async function init() {
  await sleep(300);
  const wrap = addBot('¡Hola! Soy el <strong>evaluador de ejercicios de IO</strong>.<br><br>Te voy a dar un escenario y vos tenés que plantear el modelo matemático completo:<br><strong>variables de decisión</strong>, <strong>función objetivo</strong> y <strong>restricciones</strong>.<br><br>¿Qué tipo de problema querés practicar?');
  wrap.appendChild(makeChips(
    TIPOS.map(t => ({ key: t, label: labelTipo(t) })),
    item => elegirTipo(item.key)
  ));
  scrollDown();
}

function labelTipo(t) {
  const m = { transporte: '🚛 Transporte', asignacion: '👥 Asignación', financiero: '💰 Financiero', produccion: '🏭 Producción', mezcla: '🧪 Mezcla' };
  return m[t] || t;
}

async function elegirTipo(tipo) {
  currentTipo = tipo;
  addUser(labelTipo(tipo).replace(/[^\w\sáéíóúñÁÉÍÓÚÑ]/g, '').trim());
  showTyping();

  try {
    const esc = await fetchEscenario(tipo);
    removeTyping();
    currentEscenario = esc;
    mostrarEscenario(esc);
  } catch (e) {
    removeTyping();
    addBot(`<span style="color:var(--red-t)">No pude obtener el escenario. Verificá que el backend esté corriendo en <code style="font-family:var(--mono);font-size:11px">${API}</code></span>`);
  }
}

function mostrarEscenario(esc) {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';

  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = 'Acá está tu escenario. Leelo bien y luego escribí tu resolución completa:';
  wrap.appendChild(b);

  const card = document.createElement('div');
  card.className = 'scenario-card';
  card.innerHTML = `
    <div class="scenario-title">${esc.titulo}</div>
    <div class="scenario-desc">${esc.descripcion}</div>
    <pre class="scenario-data">${esc.datos}</pre>
  `;
  wrap.appendChild(card);

  const tag = document.createElement('div');
  tag.className = 'scenario-tag';
  tag.textContent = '📐 ' + esc.tipo;
  wrap.appendChild(tag);

  msgs.appendChild(wrap);
  scrollDown();

  // habilitar input
  setTimeout(() => {
    state = 'resolucion';
    inp.disabled = false;
    sendBtn.disabled = false;
    inp.placeholder = 'Escribí tu resolución: variables de decisión, función objetivo y restricciones...';
    inp.focus();
  }, 400);
}

async function handleSend() {
  if (state !== 'resolucion') return;
  const text = inp.value.trim();
  if (!text || waiting) return;

  waiting = true;
  sendBtn.disabled = true;
  inp.disabled = true;
  inp.value = '';
  inp.style.height = 'auto';

  addUser(text);
  showTyping();

  try {
    const result = await postEvaluar(currentTipo, currentEscenario, text);
    removeTyping();

    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = 'Acá está la evaluación de tu resolución:';
    wrap.appendChild(b);
    wrap.appendChild(buildEvalCard(result));

    // botones post-evaluación
    const btns = document.createElement('div');
    btns.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:4px';
    const btnReintentar = makeActionBtn('↩ Intentar de nuevo', () => {
      waiting = false;
      state = 'resolucion';
      inp.disabled = false;
      sendBtn.disabled = false;
      inp.placeholder = 'Reescribí tu resolución...';
      inp.focus();
    });
    const btnNuevo = makeActionBtn('→ Nuevo escenario', () => {
      msgs.innerHTML = '';
      currentEscenario = null;
      currentTipo = null;
      waiting = false;
      state = 'tipo';
      inp.disabled = true;
      sendBtn.disabled = true;
      inp.placeholder = 'Escribí tu resolución...';
      init();
    });
    btns.appendChild(btnReintentar);
    btns.appendChild(btnNuevo);
    wrap.appendChild(btns);
    msgs.appendChild(wrap);
    scrollDown();

  } catch (e) {
    removeTyping();
    addBot(`<span style="color:var(--red-t)">Error al evaluar. Verificá que el backend esté corriendo y Ollama con Mistral activo.</span>`);
    waiting = false;
    inp.disabled = false;
    sendBtn.disabled = false;
    state = 'resolucion';
  }
}

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 160) + 'px';
});
sendBtn.addEventListener('click', handleSend);

init();
</script>
</body>
</html>
